[package]
name = "guren"
version = "0.5.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
rfd = "0.17.2"
sys-locale = "0.3.2"

[profile.release]
lto = "thin"
codegen-units = 1

# Decoding is far too slow without optimizations, even while developing.
[profile.dev.package."*"]
opt-level = 3

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security"] }
winreg = "0.56.0"
